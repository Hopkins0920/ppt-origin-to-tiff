name: Manual Windows candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: OriginTifTool-Windows-candidate
          path: artifacts/*.zip
          retention-days: 14
