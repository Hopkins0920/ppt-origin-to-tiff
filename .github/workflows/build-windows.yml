name: Windows portable checks
on:
  push:
    branches: [main]
    paths: ['.github/release-portable.toml']
  pull_request:
    paths:
      - 'scripts/build_portable.py'
      - 'scripts/check_portable.py'
      - 'requirements-portable-conda.txt'
      - 'requirements-build.txt'
      - 'third_party_sources.toml'
      - 'docs/WINDOWS_PORTABLE*'
      - '.github/workflows/build-windows.yml'
      - '.github/release-portable.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Create pinned native runtime
        run: '& "$env:CONDA\python.exe" -I -m conda create --prefix "$env:RUNNER_TEMP\portable-runtime" --file requirements-portable-conda.txt --yes'
      - name: Install build dependencies
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -I -m pip --isolated install --only-binary=:all: -r requirements-build.txt'
      - name: Verify dependency consistency
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -I -m pip --isolated check'
      - name: Unit tests
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -E -s -m unittest discover -s tests -v'
      - name: Build traceable portable preview
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -I scripts/build_portable.py --output-root "$env:RUNNER_TEMP\portable-build"'
      - name: Test extracted preview without Python paths
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -I scripts/check_portable.py "$env:RUNNER_TEMP\portable-build\ppt-origin-to-tiff-1.1.0-Windows-x64-preview1.zip" --work-parent "$env:RUNNER_TEMP"'
      - name: Audit source files
        run: '& "$env:RUNNER_TEMP\portable-runtime\python.exe" -I scripts/audit_source.py'
      - name: Stage verified release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-release
          path: |
            ${{ runner.temp }}/portable-build/ppt-origin-to-tiff-1.1.0-Windows-x64-preview1.zip
            ${{ runner.temp }}/portable-build/SHA256SUMS
          retention-days: 14

  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-build.txt

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable-release
          path: release-assets
      - name: Read portable release configuration
        id: config
        shell: python
        run: |
          import os, pathlib, re, tomllib
          cfg = tomllib.loads(pathlib.Path('.github/release-portable.toml').read_text())
          assert re.fullmatch(r'v\d+\.\d+\.\d+-windows-preview\d+', cfg['tag']), 'Invalid portable tag'
          assert cfg['notes'] == 'docs/RELEASE_NOTES_WINDOWS_1.1.0.md', 'Invalid release note path'
          assert pathlib.Path(cfg['notes']).is_file(), 'Missing release notes'
          assert '\n' not in cfg['title'], 'Invalid title'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag', 'title', 'notes'):
                  output.write(f'{key}={cfg[key]}\n')
      - name: Verify archive checksum
        run: cd release-assets && sha256sum -c SHA256SUMS
      - name: Publish Windows portable release
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: '${{ steps.config.outputs.tag }}'
          RELEASE_TITLE: '${{ steps.config.outputs.title }}'
          RELEASE_NOTES: '${{ steps.config.outputs.notes }}'
        run: |
          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo 'This tag already exists; no existing release or asset will be changed.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --prerelease
